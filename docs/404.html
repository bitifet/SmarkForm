  <img
    id="not-found-animation-image-control"
    class="not-found-animation-image"
    src="{{ '/assets/readme/nested_data-poster.png' | relative_url }}"
    data-static-src="{{ '/assets/readme/nested_data-poster.png' | relative_url }}"
    data-animated-src="{{ '/assets/readme/nested_data.gif' | relative_url }}"
    width="880"
    height="487"
    loading="lazy"
    decoding="async"
    alt=""
  >
  <div class="not-found-demo-controls">
    <button
      id="not-found-animation-text-control"
      class="not-found-animation-text-control"
      type="button"
      aria-controls="not-found-animation-image-control"

</figure>

<style>
  .not-found-demo {
    max-width: 880px;
    margin: 1.5rem auto;
  }
  .not-found-animation-image {
    display: block;
    width: 100%;
    border-radius: .75rem;
  }
  .not-found-animation-image.is-controllable {
    cursor: pointer;
  }
  .not-found-animation-image:focus-visible {
    outline: 3px solid #4b6fff;
    outline-offset: 4px;
  }
  .not-found-demo-controls {
    display: flex;
    justify-content: flex-end;
    margin-top: .6rem;
  }
  .not-found-animation-text-control {
    padding: 0;
    border: 0;
    background: none;
    color: #365acb;
    font: inherit;
    text-decoration: underline;
    cursor: pointer;
  }
</style>

<script>
(() => {
  const image = document.getElementById('not-found-animation-image-control');
  const textControl = document.getElementById('not-found-animation-text-control');
  if (!image || !textControl) return;

  const motionPreference = window.matchMedia
    ? window.matchMedia('(prefers-reduced-motion: reduce)')
    : { matches: false };
  let playing = !motionPreference.matches;

  const update = () => {
    const src = playing ? image.dataset.animatedSrc : image.dataset.staticSrc;
    if (image.getAttribute('src') !== src) image.setAttribute('src', src);
    const label = playing ? 'Pause the demo' : 'Play the demo';
    image.classList.add('is-controllable');
    image.setAttribute('role', 'button');
    image.setAttribute('tabindex', '0');
    image.title = label;
    image.setAttribute('aria-label', label);
    image.setAttribute('aria-pressed', String(playing));
    textControl.textContent = label;
    textControl.setAttribute('aria-pressed', String(playing));
  };

  textControl.hidden = false;
  update();
  const toggle = () => {
    playing = !playing;
    update();
  };
  image.addEventListener('click', toggle);
  image.addEventListener('keydown', event => {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    event.preventDefault();
    toggle();
  });
  textControl.addEventListener('click', toggle);

  const respectReducedMotion = event => {
    if (event.matches && playing) {
      playing = false;
      update();
    }
  };
  if (motionPreference.addEventListener) {
    motionPreference.addEventListener('change', respectReducedMotion);
  } else if (motionPreference.addListener) {
    motionPreference.addListener(respectReducedMotion);
  }
})();
</script>
