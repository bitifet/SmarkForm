<!DOCTYPE html>
<html style='--background-image-url: url("https://picsum.photos/id/972/800.jpg");'>
  <head>
    <title>SmarkForm Empty Template</title>
    <meta name='description' content='A blank SmarkForm starter form with import, export and clear triggers, ready to customize with your own fields.'>
    <meta property='og:title' content='SmarkForm Empty Template'>
    <meta property='og:description' content='A blank SmarkForm starter form with import, export and clear triggers, ready to customize with your own fields.'>
    <meta property='og:type' content='website'>
    <meta name='twitter:card' content='summary'>
    <meta name='twitter:title' content='SmarkForm Empty Template'>
    <meta name='twitter:description' content='A blank SmarkForm starter form with import, export and clear triggers, ready to customize with your own fields.'>
    <meta name='robots' content='noindex'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <meta http-equiv='Content-Type' content='text/html; charset=utf-8'>
    <link rel='stylesheet' href='smarkform_layout_sample.css'>
    <link rel='stylesheet' href='smarkform_styles_sample.css'>
    <script defer src='https://cdn.jsdelivr.net/gh/bitifet/SmarkForm@0.26.0/dist/SmarkForm.umd.js'></script>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
      
          // <!-- BEGIN controller sample-->
      
          // Essential:
          // ==========
      
          // SmarkForm instantiation:
          const myForm = new SmarkForm(document.querySelector("#main-form"));
      
      
          // Import / Export data handling:
          // ==============================
      
          // Do Something on export action:
          myForm.on("AfterAction_export"
              , ({data})=>alert (JSON.stringify(data, null, 4))
          );
      
          // Fetching data on import action (example):
          myForm.on("BeforeAction_import", (options) => {
              let data = prompt('Provide JSON data');
              try {
                  options.data = JSON.parse(data);
              } catch (err) {
                  if (data.length) {
                      alert ('⚠️  Invalid JSON!!');
                      data = null; // Emulate prompt cancel.
                  } else {
                      data = {}; // Drop form contents
                  };
              };
              if (data === null) options.preventDefault();
          });
      
      
          // Aesthetic enhancements:
          // =======================
      
          // Ask for confirm on clear action
          myForm.on("BeforeAction_clear", async ({context, preventDefault}) => {
      
              // Ask for confirmation:
              if (
                  context.getPath() == "/"      // Only for the whole form
                  && ! await context.isEmpty()  // Don't even ask if already empty
                  && ! confirm("Are you sure?")
              ) preventDefault(); // Abort if user cancelled
          });
      
          // Allow for list items addition/removal CSS animation:
          // (Propperly and/remove "animated_item" and "ongoing" CSS classes)
          const delay = ms=>new Promise(resolve=>setTimeout(resolve, ms));
          myForm.on("afterRender", async function(ev) {
              if (ev.context.parent?.options.type !== "list") return; /* Only for list items */
              const item = ev.context.targetNode;
              item.classList.add("animated_item");
              await delay(1); /* Important: Allow DOM to update */
              item.classList.add("ongoing");
          });
          myForm.on("beforeUnrender", async function(ev) {
              if (ev.context.parent?.options.type !== "list") return; /* Only for list items */
              const item = ev.context.targetNode;
              item.classList.remove("ongoing");
              /* Await for transition to be finished before item removal: */
              await delay(150);
          });
      
          // <!-- END controller sample-->
      
      });
    </script>
  </head>
  <body>
    <div class='main-container'>
      <div class='smarkForm' id='main-form'>
        <header>
          <h1>SmarkForm Empty Template</h1>
        </header>
        <!-- BEGIN SmarkForm sample-->
        <section>
          <div>Do your magic here... 😉</div>
        </section>
        <section>
          <div class='form-group'>
            <div class='spacer'></div>
            <button data-smark='{"action":"clear"}' title='Clear form data'>❌ Cancel</button>
            <button data-smark='{"action":"export"}' title='Submit form data'>💾 Submit</button>
          </div>
        </section>
        <template id='inputlist'>
          <div data-smark='{"type":"list","of":"input"}'>
            <div class='singleton'>
              <button data-smark='{"action":"removeItem","hotkey":"-"}' title='Remove this item' id='removeBtn'><span role='img' aria-label='Remove this item'>➖</span></button>
              <input data-smark id='listInput'>
              <button data-smark='{"action":"addItem","hotkey":"+"}' title='Add new item below'><span role='img' aria-label='Add new item'>➕</span></button>
            </div>
          </div>
        </template>
        <!-- END SmarkForm sample-->
        <footer class='smarkform-badge-footer'><a href='https://smarkform.bitifet.net/for_end_users/user_guide' title='Learn about SmarkForm-powered forms' target='_blank' rel='noopener noreferrer'><img src='https://cdn.jsdelivr.net/gh/bitifet/SmarkForm@main/docs/assets/logo/smarkform_compact.svg' alt='Powered by SmarkForm' height='24'></a></footer>
      </div>
    </div>
  </body>
</html>
