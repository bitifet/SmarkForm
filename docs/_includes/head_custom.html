<!-- Custom head content for auto color scheme and logo switching -->

{% if page.noindex %}
<meta name="robots" content="noindex, nofollow">
{% elsif page.url == "/404.html" %}
<meta name="robots" content="noindex, follow">
{% endif %}

{% if page.preload_dragdroptouch %}
<!-- Warm the module's HTTP cache for the touch-drag example loaded in an iframe. -->
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@dragdroptouch/drag-drop-touch@2.0.3/dist/drag-drop-touch.esm.min.js" crossorigin="anonymous">
{% endif %}

<!-- Auto Color Scheme CSS -->
<link rel="stylesheet" href="{{ '/assets/css/auto-color-scheme.css' | relative_url }}">

<!-- User Guide Images CSS -->
<link rel="stylesheet" href="{{ '/assets/css/user-guide-images.css' | relative_url }}">

<!-- Responsive Typography CSS -->
<link rel="stylesheet" href="{{ '/assets/css/responsive-typography.css' | relative_url }}">

<!-- Dynamic Logo Switcher JavaScript -->
<script src="{{ '/assets/js/auto-logo-switcher.js' | relative_url }}"></script>

<!-- Navigation Enhancements JavaScript -->
<script src="{{ '/assets/js/nav-enhancements.js' | relative_url }}"></script>
